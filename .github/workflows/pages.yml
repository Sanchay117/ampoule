name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPACTC_VERSION: 0.31.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Compact compiler
        run: |
          dir="$HOME/.local/compactc-${COMPACTC_VERSION}"
          curl -fsSL -o /tmp/compactc.zip \
            "https://github.com/midnightntwrk/compact/releases/download/compactc-v${COMPACTC_VERSION}/compactc_v${COMPACTC_VERSION}_x86_64-unknown-linux-musl.zip"
          mkdir -p "$dir"
          unzip -q /tmp/compactc.zip -d "$dir"

      - run: npm ci

      # The live page deploys and proves from the browser, so the site serves the proving keys.
      # Key generation is deterministic: these match the keys the CLI deployed with.
      - name: Compile the contract with its proving keys
        run: |
          npm run compile
          npm run -w web zk:stage

      - name: Build the site
        run: npm run build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
